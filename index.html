<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stream Training</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111318;
            color: #ffffff;
        }

        .app {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .status {
            color: #6ee7b7;
            font-size: 14px;
        }

        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #1b1e26;
            border: 1px solid #2b303b;
            border-radius: 15px;
            padding: 20px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .chat-box {
            height: 420px;
            overflow-y: auto;
            padding: 5px;
        }

        .chat {
            margin-bottom: 14px;
        }

        .name {
            font-weight: bold;
            color: #8ab4ff;
            margin-bottom: 4px;
        }

        .message {
            background: #252936;
            border-radius: 10px;
            padding: 10px 12px;
            display: inline-block;
            max-width: 90%;
        }

        .my-answer {
            margin-top: 15px;
        }

        textarea {
            width: 100%;
            height: 100px;
            resize: none;
            border: 1px solid #343946;
            border-radius: 10px;
            background: #111318;
            color: white;
            padding: 12px;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #6d8cff;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .feedback {
            min-height: 420px;
        }

        .score-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .score {
            background: #252936;
            border-radius: 10px;
            padding: 15px;
        }

        .score-name {
            color: #aeb5c5;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .score-value {
            font-size: 25px;
            font-weight: bold;
        }

        .feedback-text {
            background: #252936;
            border-radius: 10px;
            padding: 15px;
            line-height: 1.6;
            color: #d9deea;
            white-space: pre-line;
        }

        .start-button {
            background: #10b981;
            margin-bottom: 20px;
        }

        .start-button:hover {
            background: #059669;
        }

        /* ==========================================
           분석 선택 버튼
           ========================================== */

        .analysis-controls {
            margin-top: 15px;
            padding: 15px;
            background: #20232d;
            border-radius: 10px;
        }

        .analysis-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .analysis-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .analysis-button {
            margin-top: 0;
            padding: 11px 5px;
            font-size: 13px;
            background: #5865f2;
        }

        .analysis-button:hover {
            background: #4752c4;
        }

        .analysis-button.selected {
            background: #10b981;
        }

        @media (max-width: 800px) {
            .main {
                grid-template-columns: 1fr;
            }

            .chat-box {
                height: 300px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h1>🎙️ AI Stream Training</h1>
        <div class="status">● 연습 준비 완료</div>
    </header>

    <button class="start-button" onclick="startTraining()">
        🎬 방송 연습 시작
    </button>

    <div class="main">

        <!-- ==========================================
             왼쪽 : AI 시청자
             ========================================== -->

        <div class="panel">

            <div class="panel-title">
                💬 AI 시청자
            </div>

            <div class="chat-box" id="chatBox">

                <div class="chat">
                    <div class="name">시청자_김민수</div>

                    <div class="message">
                        방송 처음 보는데 오늘 뭐 하실 거예요?
                    </div>
                </div>

            </div>

            <div class="my-answer">

                <textarea
                    id="answerInput"
                    placeholder="시청자에게 답변해보세요..."
                ></textarea>

                <button
                    id="answerButton"
                    onclick="submitAnswer()"
                >
                    💬 답변하기
                </button>

            </div>

        </div>


        <!-- ==========================================
             오른쪽 : AI 피드백
             ========================================== -->

        <div class="panel feedback">

            <div class="panel-title">
                📊 AI 방송 피드백
            </div>

            <div class="score-container">

                <div class="score">
                    <div class="score-name">
                        소통 능력
                    </div>

                    <div
                        class="score-value"
                        id="communicationScore"
                    >
                        -
                    </div>
                </div>

                <div class="score">
                    <div class="score-name">
                        자연스러움
                    </div>

                    <div
                        class="score-value"
                        id="naturalScore"
                    >
                        -
                    </div>
                </div>

                <div class="score">
                    <div class="score-name">
                        재미
                    </div>

                    <div
                        class="score-value"
                        id="funScore"
                    >
                        -
                    </div>
                </div>

                <div class="score">
                    <div class="score-name">
                        대화 지속력
                    </div>

                    <div
                        class="score-value"
                        id="conversationScore"
                    >
                        -
                    </div>
                </div>

            </div>

            <div
                class="feedback-text"
                id="feedbackText"
            >
                방송 연습을 시작하면
                AI가 여러분의 답변을 분석합니다.
            </div>

            <!-- 다음 분석 구간 선택 -->

            <div
                class="analysis-controls"
                id="analysisControls"
                style="display:none;"
            >

                <div class="analysis-title">
                    다음에 몇 개의 채팅을 연습할까요?
                </div>

                <div class="analysis-buttons">

                    <button
                        class="analysis-button"
                        onclick="selectNextBatch(5)"
                    >
                        다음 5개
                    </button>

                    <button
                        class="analysis-button"
                        onclick="selectNextBatch(10)"
                    >
                        다음 10개
                    </button>

                    <button
                        class="analysis-button"
                        onclick="selectNextBatch(20)"
                    >
                        다음 20개
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // 방송 연습 상태
    // ==========================================

    let trainingStarted = false;

    let currentChat = "";

    // 전체 진행한 채팅 수
    let totalRounds = 0;

    // 현재 분석 구간에서 진행한 채팅 수
    let currentBatchRounds = 0;

    // 현재 분석 구간 크기
    let currentBatchTarget = 5;

    // 현재 분석 구간 시작 번호
    let currentBatchStart = 1;

    // 현재 분석 구간의 대화
    let currentBatchConversations = [];

    // 가장 최근 분석 결과
    let previousAnalysis = null;

    // 최근 대화 기억
    let recentConversations = [];

    // 현재 시청자 성향
    let currentViewerProfile = null;

    // AI 요청 중인지
    let aiBusy = false;


    // ==========================================
    // 시청자 성향
    // ==========================================

    const viewerProfiles = [

        {
            type: "처음 온 시청자",
            style: "방송을 처음 보는 사람처럼 가볍게 질문하고 반응한다."
        },

        {
            type: "오래 본 시청자",
            style: "방송인의 이전 행동이나 말을 기억하고 자연스럽게 언급한다."
        },

        {
            type: "장난치는 시청자",
            style: "가끔 가볍게 놀리거나 농담을 섞는다."
        },

        {
            type: "질문이 많은 시청자",
            style: "방송 내용에 관심을 가지고 자연스럽게 질문한다."
        },

        {
            type: "조용한 시청자",
            style: "평소에는 조용하지만 가끔 짧게 반응한다."
        },

        {
            type: "게임 관심 시청자",
            style: "게임 플레이나 실력, 전략 등에 관심을 보인다."
        },

        {
            type: "리액션이 큰 시청자",
            style: "재미있는 상황에서 짧고 강하게 반응한다."
        },

        {
            type: "그냥 지나가다 들어온 시청자",
            style: "방송 내용에 가볍게 반응하다가 다른 주제로 넘어가기도 한다."
        }

    ];


    // ==========================================
    // AI에게 요청
    // ==========================================

    async function callAI(data) {

        const response = await fetch(
            "/api/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        const result = await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "AI 요청에 실패했습니다."
            );

        }


        return result;

    }


    // ==========================================
    // 방송 연습 시작
    // ==========================================

    async function startTraining() {

        trainingStarted = true;

        totalRounds = 0;

        currentBatchRounds = 0;

        currentBatchTarget = 5;

        currentBatchStart = 1;

        currentBatchConversations = [];

        previousAnalysis = null;

        recentConversations = [];

        currentViewerProfile = null;


        const chatBox =
            document.getElementById("chatBox");

        const feedbackText =
            document.getElementById("feedbackText");

        const answerInput =
            document.getElementById("answerInput");

        const startButton =
            document.querySelector(".start-button");

        const analysisControls =
            document.getElementById("analysisControls");


        startButton.disabled = true;

        analysisControls.style.display = "none";


        document.querySelector(".status").textContent =
            "● AI 시청자 생성 중...";


        feedbackText.textContent =
            "⏳ AI가 실제 방송 같은 시청자 채팅을 만들고 있습니다.";


        chatBox.innerHTML = "";


        try {

            await generateNextViewer();


            document.querySelector(".status").textContent =
                "● 방송 연습 중 (1~5)";


            feedbackText.textContent =
                "첫 번째 시청자의 채팅에 답변해보세요.";


            answerInput.focus();


        } catch (error) {

            console.error(error);


            document.querySelector(".status").textContent =
                "● 오류 발생";


            feedbackText.textContent =
                "AI 시청자를 불러오지 못했습니다.\n\n" +
                error.message;


            trainingStarted = false;

        }


        startButton.disabled = false;

    }


    // ==========================================
    // 답변 제출
    // ==========================================

    async function submitAnswer() {

        if (!trainingStarted) {

            alert(
                "먼저 '방송 연습 시작'을 눌러주세요."
            );

            return;

        }


        if (aiBusy) {
            return;
        }


        const input =
            document.getElementById("answerInput");

        const answer =
            input.value.trim();


        if (!answer) {

            alert(
                "답변을 입력해주세요."
            );

            return;

        }


        const answerButton =
            document.getElementById("answerButton");

        const feedbackText =
            document.getElementById("feedbackText");

        const chatBox =
            document.getElementById("chatBox");


        aiBusy = true;

        answerButton.disabled = true;


        // ==========================================
        // 내 답변 화면에 표시
        // ==========================================

        const myChat =
            document.createElement("div");


        myChat.className = "chat";


        myChat.innerHTML = `

            <div class="name">
                나
            </div>

            <div class="message">
                ${escapeHTML(answer)}
            </div>

        `;


        chatBox.appendChild(myChat);


        chatBox.scrollTop =
            chatBox.scrollHeight;


        input.value = "";


        // ==========================================
        // 현재 대화 저장
        // ==========================================

        const conversation = {

            chat: currentChat,

            answer: answer

        };


        currentBatchConversations.push(
            conversation
        );


        recentConversations.push(
            conversation
        );


        // 최근 5개만 AI에게 기억시킴
        if (recentConversations.length > 5) {

            recentConversations =
                recentConversations.slice(-5);

        }


        totalRounds++;

        currentBatchRounds++;


        feedbackText.textContent =
            "⏳ 다음 시청자 채팅을 준비하고 있습니다.";


        document.querySelector(".status").textContent =
            `● ${totalRounds}번째 대화 완료`;


        // ==========================================
        // 현재 분석 구간이 끝났는지 확인
        // ==========================================

        if (
            currentBatchRounds >=
            currentBatchTarget
        ) {

            await analyzeCurrentBatch();

            aiBusy = false;

            answerButton.disabled = false;

            return;

        }


        // ==========================================
        // 아직 분석 구간이 남았으면
        // 다음 시청자 생성
        // ==========================================

        try {

            await generateNextViewer();

        } catch (error) {

            console.error(error);

            feedbackText.textContent =
                "다음 시청자를 불러오지 못했습니다.\n\n" +
                error.message;

        }


        aiBusy = false;

        answerButton.disabled = false;

    }


    // ==========================================
    // 현재 배치 분석
    // ==========================================

    async function analyzeCurrentBatch() {

        const feedbackText =
            document.getElementById("feedbackText");

        const analysisControls =
            document.getElementById("analysisControls");


        document.querySelector(".status").textContent =
            `● ${currentBatchStart}~${totalRounds} 분석 중...`;


        feedbackText.textContent =
            `⏳ ${currentBatchStart}~${totalRounds}번째 대화를 분석하고 있습니다.`;


        analysisControls.style.display =
            "none";


        try {

            const data = await callAI({

                type: "batchFeedback",

                conversations:
                    currentBatchConversations,

                previousAnalysis:
                    previousAnalysis,

                startRound:
                    currentBatchStart,

                endRound:
                    totalRounds

            });


            let feedback;


            try {

                feedback =
                    JSON.parse(data.result);

            } catch (error) {

                throw new Error(
                    "AI가 올바른 분석 형식을 반환하지 않았습니다."
                );

            }


            // ==========================================
            // 점수 표시
            // ==========================================

            document.getElementById(
                "communicationScore"
            ).textContent =
                `${feedback.communication ?? "-"}점`;


            document.getElementById(
                "naturalScore"
            ).textContent =
                `${feedback.natural ?? "-"}점`;


            document.getElementById(
                "funScore"
            ).textContent =
                `${feedback.fun ?? "-"}점`;


            document.getElementById(
                "conversationScore"
            ).textContent =
                `${feedback.conversation ?? "-"}점`;


            // ==========================================
            // 피드백 표시
            // ==========================================

            let feedbackMessage =

                `📊 ${currentBatchStart}~${totalRounds}번째 분석\n\n` +

                `👍 잘한 점\n` +
                `${feedback.strengths || "없음"}\n\n` +

                `🔧 개선할 점\n` +
                `${feedback.improvements || "없음"}\n\n` +

                `💡 더 좋은 답변 방향\n` +
                `${feedback.betterAnswer || "없음"}\n\n` +

                `📈 이전 분석과 비교\n` +
                `${feedback.comparison || "비교 내용이 없습니다."}`;


            feedbackText.textContent =
                feedbackMessage;


            document.querySelector(".status").textContent =
                `● ${currentBatchStart}~${totalRounds} 분석 완료`;


            // ==========================================
            // 현재 분석을 다음 분석의 기준으로 저장
            // ==========================================

            previousAnalysis =
                feedback;


            // ==========================================
            // 다음 배치 준비
            // ==========================================

            currentBatchStart =
                totalRounds + 1;

            currentBatchRounds = 0;

            currentBatchConversations = [];


            feedbackText.textContent +=
                "\n\n다음 연습 구간을 선택하세요.";


            analysisControls.style.display =
                "block";


        } catch (error) {

            console.error(error);


            feedbackText.textContent =
                "AI 분석 중 오류가 발생했습니다.\n\n" +
                error.message;


            document.querySelector(".status").textContent =
                "● 분석 오류";


            // 실패했을 때 현재 배치는 유지
            // 다시 분석할 수 있도록 한다

            analysisControls.style.display =
                "none";

        }

    }


    // ==========================================
    // 다음 배치 선택
    // ==========================================

    async function selectNextBatch(number) {

        if (!trainingStarted) {
            return;
        }


        if (aiBusy) {
            return;
        }


        aiBusy = true;


        const analysisControls =
            document.getElementById("analysisControls");

        const feedbackText =
            document.getElementById("feedbackText");

        const answerButton =
            document.getElementById("answerButton");


        currentBatchTarget =
            number;

        currentBatchRounds = 0;

        currentBatchConversations = [];


        analysisControls.style.display =
            "none";


        answerButton.disabled = true;


        document.querySelector(".status").textContent =
            `● 다음 ${number}개 연습 준비 중...`;


        feedbackText.textContent =
            `${currentBatchStart}~${currentBatchStart + number - 1}번째 채팅을 시작합니다.`;


        try {

            await generateNextViewer();

        } catch (error) {

            console.error(error);

            feedbackText.textContent =
                "다음 연습을 시작하지 못했습니다.\n\n" +
                error.message;

        }


        aiBusy = false;

        answerButton.disabled = false;

    }


    // ==========================================
    // 다음 시청자 생성
    // ==========================================

    async function generateNextViewer() {

        if (!trainingStarted) {
            return;
        }


        const feedbackText =
            document.getElementById("feedbackText");


        document.querySelector(".status").textContent =
            "● 다음 시청자 준비 중...";


        // ==========================================
        // 시청자 성향 결정
        // ==========================================

        if (!currentViewerProfile) {

            currentViewerProfile =
                randomViewerProfile();

        }


        // 일정 확률로 새로운 시청자 성향
        // 현재 대화 흐름이 너무 오래 이어지지 않도록 함

        if (
            Math.random() < 0.25 &&
            totalRounds > 0
        ) {

            currentViewerProfile =
                randomViewerProfile();

        }


        try {

            const data = await callAI({

                type: "viewer",

                recentConversations:
                    recentConversations,

                viewerProfile:
                    currentViewerProfile

            });


            currentChat =
                data.result;


            const chatBox =
                document.getElementById("chatBox");


            const viewerChat =
                document.createElement("div");


            viewerChat.className =
                "chat";


            viewerChat.innerHTML = `

                <div class="name">
                    시청자_${randomViewerName()}
                </div>

                <div class="message">
                    ${escapeHTML(currentChat)}
                </div>

            `;


            chatBox.appendChild(viewerChat);


            chatBox.scrollTop =
                chatBox.scrollHeight;


            feedbackText.textContent =
                "새로운 시청자의 채팅입니다.\n" +
                "자연스럽게 답변해보세요.";


            document.querySelector(".status").textContent =
                `● 방송 연습 중 (${currentBatchStart}~${currentBatchStart + currentBatchTarget - 1})`;


            document.getElementById(
                "answerInput"
            ).focus();


        } catch (error) {

            console.error(error);


            throw error;

        }

    }


    // ==========================================
    // 랜덤 시청자 성향
    // ==========================================

    function randomViewerProfile() {

        return viewerProfiles[
            Math.floor(
                Math.random() *
                viewerProfiles.length
            )
        ];

    }


    // ==========================================
    // 가상의 시청자 이름
    // ==========================================

    function randomViewerName() {

        const names = [

            "김민수",
            "이준혁",
            "박지훈",
            "최현우",
            "정우진",
            "김도윤",
            "이서준",
            "박민재"

        ];


        return names[
            Math.floor(
                Math.random() *
                names.length
            )
        ];

    }


    // ==========================================
    // HTML 문자 보호
    // ==========================================

    function escapeHTML(text) {

        const div =
            document.createElement("div");


        div.textContent =
            text;


        return div.innerHTML;

    }


    // ==========================================
    // Enter로 답변
    // Shift + Enter는 줄바꿈
    // ==========================================

    document
        .getElementById("answerInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    submitAnswer();

                }

            }
        );

</script>

</body>
</html>
