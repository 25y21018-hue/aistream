<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stream Training</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111318;
            color: #ffffff;
        }

        .app {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .status {
            color: #6ee7b7;
            font-size: 14px;
        }

        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #1b1e26;
            border: 1px solid #2b303b;
            border-radius: 15px;
            padding: 20px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .chat-box {
            height: 420px;
            overflow-y: auto;
            padding: 5px;
        }

        .chat {
            margin-bottom: 14px;
        }

        .name {
            font-weight: bold;
            color: #8ab4ff;
            margin-bottom: 4px;
        }

        .message {
            background: #252936;
            border-radius: 10px;
            padding: 10px 12px;
            display: inline-block;
            max-width: 90%;
        }

        .my-answer {
            margin-top: 15px;
        }

        textarea {
            width: 100%;
            height: 100px;
            resize: none;
            border: 1px solid #343946;
            border-radius: 10px;
            background: #111318;
            color: white;
            padding: 12px;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #6d8cff;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .feedback {
            min-height: 420px;
        }

        .score-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .score {
            background: #252936;
            border-radius: 10px;
            padding: 15px;
        }

        .score-name {
            color: #aeb5c5;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .score-value {
            font-size: 25px;
            font-weight: bold;
        }

        .feedback-text {
            background: #252936;
            border-radius: 10px;
            padding: 15px;
            line-height: 1.6;
            color: #d9deea;
            white-space: pre-line;
        }

        .start-button {
            background: #10b981;
            margin-bottom: 20px;
        }

        .start-button:hover {
            background: #059669;
        }

        /* ==========================================
           분석 선택 버튼
           ========================================== */

        .analysis-controls {
            margin-top: 15px;
            padding: 15px;
            background: #20232d;
            border-radius: 10px;
        }

        .analysis-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .analysis-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .analysis-button {
            margin-top: 0;
            padding: 11px 5px;
            font-size: 13px;
            background: #5865f2;
        }

        .analysis-button:hover {
            background: #4752c4;
        }

        .analysis-button.selected {
            background: #10b981;
        }

        @media (max-width: 800px) {
            .main {
                grid-template-columns: 1fr;
            }

            .chat-box {
                height: 300px;
            }

            .analysis-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h1>🎙️ AI Stream Training</h1>
        <div class="status">● 연습 준비 완료</div>
    </header>

    <button class="start-button" onclick="startTraining()">
        🎬 방송 연습 시작
    </button>

    <div class="main">

        <!-- 왼쪽 : AI 시청자 -->
        <div class="panel">

            <div class="panel-title">
                💬 AI 시청자
            </div>

            <div class="chat-box" id="chatBox">

                <div class="chat">
                    <div class="name">
                        시청자_김민수
                    </div>

                    <div class="message">
                        방송 처음 보는데 오늘 뭐 하실 거예요?
                    </div>
                </div>

            </div>

            <div class="my-answer">

                <textarea
                    id="answerInput"
                    placeholder="시청자에게 답변해보세요..."
                ></textarea>

                <button
                    id="answerButton"
                    onclick="submitAnswer()"
                >
                    💬 답변하기
                </button>

            </div>

        </div>


        <!-- 오른쪽 : AI 피드백 -->
        <div class="panel feedback">

            <div class="panel-title">
                📊 AI 방송 피드백
            </div>

            <div class="score-container">

                <div class="score">
                    <div class="score-name">
                        소통 능력
                    </div>

                    <div
                        class="score-value"
                        id="communicationScore"
                    >
                        -
                    </div>
                </div>


                <div class="score">
                    <div class="score-name">
                        자연스러움
                    </div>

                    <div
                        class="score-value"
                        id="naturalScore"
                    >
                        -
                    </div>
                </div>


                <div class="score">
                    <div class="score-name">
                        재미
                    </div>

                    <div
                        class="score-value"
                        id="funScore"
                    >
                        -
                    </div>
                </div>


                <div class="score">
                    <div class="score-name">
                        대화 지속력
                    </div>

                    <div
                        class="score-value"
                        id="conversationScore"
                    >
                        -
                    </div>
                </div>

            </div>


            <div
                class="feedback-text"
                id="feedbackText"
            >
                방송 연습을 시작하면
                AI가 여러분의 답변을 분석합니다.
            </div>


            <!-- 5 / 10 / 20 선택 버튼 -->
            <div
                class="analysis-controls"
                id="analysisControls"
                style="display: none;"
            >

                <div class="analysis-title">
                    📌 다음 분석까지 진행할 채팅 수를 선택하세요.
                </div>

                <div class="analysis-buttons">

                    <button
                        class="analysis-button"
                        onclick="selectNextBatch(5)"
                    >
                        다음 5개
                    </button>

                    <button
                        class="analysis-button"
                        onclick="selectNextBatch(10)"
                    >
                        다음 10개
                    </button>

                    <button
                        class="analysis-button"
                        onclick="selectNextBatch(20)"
                    >
                        다음 20개
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // 방송 연습 상태
    // ==========================================

    let trainingStarted = false;

    // 현재 AI 시청자 채팅
    let currentChat = "";

    // 지금까지 진행한 전체 횟수
    let totalRounds = 0;

    // 현재 분석 구간에서 몇 번 진행했는지
    let currentBatchRounds = 0;

    // 현재 선택된 다음 분석 횟수
    let currentBatchTarget = 5;

    // 현재 분석 구간의 시작 번호
    let currentBatchStart = 1;

    // 현재 분석 구간의 대화
    let currentBatchConversations = [];

    // 직전 분석 결과
    let previousAnalysis = null;

    // AI 요청 중인지 확인
    let aiBusy = false;


    // ==========================================
    // AI에게 요청
    // ==========================================

    async function callAI(data) {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });


        const result = await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "AI 요청에 실패했습니다."
            );

        }


        return result;
    }


    // ==========================================
    // 방송 연습 시작
    // ==========================================

    async function startTraining() {

        if (aiBusy) {
            return;
        }


        trainingStarted = true;

        totalRounds = 0;

        currentBatchRounds = 0;

        currentBatchTarget = 5;

        currentBatchStart = 1;

        currentBatchConversations = [];

        previousAnalysis = null;


        const chatBox =
            document.getElementById("chatBox");

        const feedbackText =
            document.getElementById("feedbackText");

        const answerInput =
            document.getElementById("answerInput");

        const answerButton =
            document.getElementById("answerButton");

        const startButton =
            document.querySelector(".start-button");

        const controls =
            document.getElementById("analysisControls");


        startButton.disabled = true;

        answerButton.disabled = true;

        controls.style.display = "none";


        // 점수 초기화
        document.getElementById(
            "communicationScore"
        ).textContent = "-";

        document.getElementById(
            "naturalScore"
        ).textContent = "-";

        document.getElementById(
            "funScore"
        ).textContent = "-";

        document.getElementById(
            "conversationScore"
        ).textContent = "-";


        chatBox.innerHTML = "";


        document.querySelector(".status").textContent =
            "● AI 시청자 생성 중...";


        feedbackText.textContent =
            "⏳ AI가 실제 방송 같은 시청자 채팅을 만들고 있습니다.";


        aiBusy = true;


        try {

            const data = await callAI({
                type: "viewer"
            });


            currentChat = data.result;


            addViewerChat(currentChat);


            document.querySelector(".status").textContent =
                "● 방송 연습 중 (1~5)";


            feedbackText.textContent =
                "첫 번째 5개 채팅을 진행합니다.\n" +
                "시청자의 채팅에 답변해보세요.";


            answerInput.focus();

            answerButton.disabled = false;


        } catch (error) {

            console.error(error);


            document.querySelector(".status").textContent =
                "● 오류 발생";


            feedbackText.textContent =
                "AI 시청자를 불러오지 못했습니다.\n\n" +
                error.message;


            trainingStarted = false;

            startButton.disabled = false;

        }


        aiBusy = false;
    }


    // ==========================================
    // 답변 제출
    // ==========================================

    async function submitAnswer() {

        if (!trainingStarted) {

            alert(
                "먼저 '방송 연습 시작'을 눌러주세요."
            );

            return;
        }


        if (aiBusy) {
            return;
        }


        const input =
            document.getElementById("answerInput");

        const answer =
            input.value.trim();


        if (!answer) {

            alert(
                "답변을 입력해주세요."
            );

            return;
        }


        const answerButton =
            document.getElementById("answerButton");


        const feedbackText =
            document.getElementById("feedbackText");


        const chatBox =
            document.getElementById("chatBox");


        // ==========================================
        // 내 답변 화면 표시
        // ==========================================

        const myChat =
            document.createElement("div");

        myChat.className = "chat";


        myChat.innerHTML = `

            <div class="name">
                나
            </div>

            <div class="message">
                ${escapeHTML(answer)}
            </div>

        `;


        chatBox.appendChild(myChat);


        chatBox.scrollTop =
            chatBox.scrollHeight;


        input.value = "";


        answerButton.disabled = true;


        // ==========================================
        // 현재 채팅 저장
        // ==========================================

        currentBatchConversations.push({

            chat: currentChat,

            answer: answer

        });


        totalRounds++;

        currentBatchRounds++;


        document.querySelector(".status").textContent =
            `● 방송 연습 중 (${currentBatchRounds}/${currentBatchTarget})`;


        // ==========================================
        // 아직 이번 분석 횟수에 도달하지 않았다면
        // 다음 시청자 생성
        // ==========================================

        if (
            currentBatchRounds <
            currentBatchTarget
        ) {

            feedbackText.textContent =
                `현재 ${currentBatchRounds}번째 채팅입니다.\n` +
                `이번 분석까지 ${currentBatchTarget - currentBatchRounds}개 남았습니다.`;

            await generateNextViewer();

            return;
        }


        // ==========================================
        // 분석 횟수 도달
        // ==========================================

        await analyzeCurrentBatch();

    }


    // ==========================================
    // 현재 배치 분석
    // ==========================================

    async function analyzeCurrentBatch() {

        if (aiBusy) {
            return;
        }


        aiBusy = true;


        const feedbackText =
            document.getElementById("feedbackText");

        const answerButton =
            document.getElementById("answerButton");

        const controls =
            document.getElementById("analysisControls");


        answerButton.disabled = true;


        document.querySelector(".status").textContent =
            `● ${currentBatchStart}~${totalRounds}개 분석 중...`;


        feedbackText.textContent =
            `⏳ ${currentBatchStart}~${totalRounds}번째 채팅을 분석하고 있습니다.`;


        try {

            const data = await callAI({

                type: "batchFeedback",

                conversations:
                    currentBatchConversations,

                previousAnalysis:
                    previousAnalysis,

                startRound:
                    currentBatchStart,

                endRound:
                    totalRounds

            });


            let feedback;


            try {

                feedback =
                    JSON.parse(data.result);

            } catch (error) {

                throw new Error(
                    "AI가 올바른 피드백 형식을 반환하지 않았습니다."
                );

            }


            // ==========================================
            // 점수 표시
            // ==========================================

            document.getElementById(
                "communicationScore"
            ).textContent =
                `${feedback.communication ?? "-"}점`;


            document.getElementById(
                "naturalScore"
            ).textContent =
                `${feedback.natural ?? "-"}점`;


            document.getElementById(
                "funScore"
            ).textContent =
                `${feedback.fun ?? "-"}점`;


            document.getElementById(
                "conversationScore"
            ).textContent =
                `${feedback.conversation ?? "-"}점`;


            // ==========================================
            // 피드백 표시
            // ==========================================

            let resultText = "";

            resultText +=
                `📊 ${currentBatchStart}~${totalRounds}번째 채팅 분석\n\n`;


            resultText +=
                `🟢 잘한 점\n` +
                `${feedback.strengths || "없음"}\n\n`;


            resultText +=
                `🔧 개선할 점\n` +
                `${feedback.improvements || "없음"}\n\n`;


            resultText +=
                `💡 다음 연습에서 신경 쓸 점\n` +
                `${feedback.betterAnswer || "없음"}\n\n`;


            if (previousAnalysis) {

                resultText +=
                    `📈 이전 분석과 비교\n` +
                    `${feedback.comparison || "비교 내용이 없습니다."}`;

            } else {

                resultText +=
                    `📈 이전 분석과 비교\n` +
                    `첫 분석이라 비교할 이전 결과가 없습니다.`;

            }


            feedbackText.textContent =
                resultText;


            // ==========================================
            // 이번 분석 결과를
            // 다음 분석의 기준으로 저장
            // ==========================================

            previousAnalysis = {

                communication:
                    feedback.communication,

                natural:
                    feedback.natural,

                fun:
                    feedback.fun,

                conversation:
                    feedback.conversation,

                strengths:
                    feedback.strengths,

                improvements:
                    feedback.improvements,

                betterAnswer:
                    feedback.betterAnswer,

                comparison:
                    feedback.comparison

            };


            // ==========================================
            // 다음 배치 준비
            // ==========================================

            currentBatchStart =
                totalRounds + 1;

            currentBatchRounds = 0;

            currentBatchConversations = [];


            document.querySelector(".status").textContent =
                `● ${totalRounds}개 분석 완료`;


            // 선택 버튼 표시
            controls.style.display = "block";


            answerButton.disabled = true;


        } catch (error) {

            console.error(error);


            feedbackText.textContent =
                "AI 분석 중 오류가 발생했습니다.\n\n" +
                error.message;


            document.querySelector(".status").textContent =
                "● 분석 오류";


            // 분석 실패 시
            // 현재 배치 데이터를 유지
            answerButton.disabled = true;

        }


        aiBusy = false;
    }


    // ==========================================
    // 다음 분석 횟수 선택
    // ==========================================

    async function selectNextBatch(number) {

        if (!trainingStarted) {
            return;
        }


        if (aiBusy) {
            return;
        }


        currentBatchTarget =
            number;

        currentBatchRounds = 0;

        currentBatchConversations = [];


        const controls =
            document.getElementById("analysisControls");

        const feedbackText =
            document.getElementById("feedbackText");

        const answerButton =
            document.getElementById("answerButton");


        controls.style.display = "none";

        answerButton.disabled = true;


        document.querySelector(".status").textContent =
            `● 다음 ${number}개 채팅 준비 중...`;


        feedbackText.textContent =
            `다음 ${number}개의 채팅을 진행합니다.\n` +
            `현재 ${currentBatchStart}번째 채팅부터 시작합니다.`;


        await generateNextViewer();

    }


    // ==========================================
    // 다음 시청자 생성
    // ==========================================

    async function generateNextViewer() {

        if (!trainingStarted) {
            return;
        }


        if (aiBusy) {
            return;
        }


        aiBusy = true;


        const feedbackText =
            document.getElementById("feedbackText");

        const answerButton =
            document.getElementById("answerButton");

        const answerInput =
            document.getElementById("answerInput");


        answerButton.disabled = true;


        document.querySelector(".status").textContent =
            `● ${currentBatchStart + currentBatchRounds}번째 시청자 준비 중...`;


        try {

            const data = await callAI({

                type: "viewer"

            });


            currentChat =
                data.result;


            addViewerChat(currentChat);


            document.querySelector(".status").textContent =
                `● 방송 연습 중 (${currentBatchRounds}/${currentBatchTarget})`;


            feedbackText.textContent =
                `현재 ${currentBatchRounds} / ${currentBatchTarget}개 진행 중입니다.\n` +
                `시청자의 채팅에 답변해보세요.`;


            answerButton.disabled = false;

            answerInput.focus();


        } catch (error) {

            console.error(error);


            feedbackText.textContent =
                "다음 시청자를 불러오지 못했습니다.\n\n" +
                error.message;


            document.querySelector(".status").textContent =
                "● 오류 발생";


            answerButton.disabled = false;

        }


        aiBusy = false;
    }


    // ==========================================
    // 시청자 채팅 추가
    // ==========================================

    function addViewerChat(chat) {

        const chatBox =
            document.getElementById("chatBox");


        const viewerChat =
            document.createElement("div");


        viewerChat.className =
            "chat";


        viewerChat.innerHTML = `

            <div class="name">
                시청자_${randomViewerName()}
            </div>

            <div class="message">
                ${escapeHTML(chat)}
            </div>

        `;


        chatBox.appendChild(viewerChat);


        chatBox.scrollTop =
            chatBox.scrollHeight;
    }


    // ==========================================
    // 가상의 시청자 이름
    // ==========================================

    function randomViewerName() {

        const names = [

            "김민수",
            "이준혁",
            "박지훈",
            "최현우",
            "정우진",
            "김도윤",
            "이서준",
            "박민재"

        ];


        return names[
            Math.floor(
                Math.random() *
                names.length
            )
        ];
    }


    // ==========================================
    // HTML 문자 보호
    // ==========================================

    function escapeHTML(text) {

        const div =
            document.createElement("div");


        div.textContent =
            text;


        return div.innerHTML;
    }


    // ==========================================
    // Enter로 답변하기
    // Shift + Enter는 줄바꿈
    // ==========================================

    document
        .getElementById("answerInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    submitAnswer();

                }

            }
        );

</script>

</body>
</html>
